name: Rapport de bug
description: Signaler un comportement inattendu dans Wave (macOS, iOS, iPadOS ou serveur MCP)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. Plus les informations ci-dessous sont précises, plus vite nous pourrons le reproduire et le corriger.
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - iPhone (iOS)
        - iPad (iPadOS)
        - Serveur MCP (WaveMCP)
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Version du système
      placeholder: "ex. macOS 26.1 / iOS 18.4"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Version de Wave
      placeholder: "ex. 1.1.0 (Release GitHub ou Wave Dev)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Décrivez clairement ce qui ne fonctionne pas.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir Wave…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Que devait-il se passer ?
  - type: textarea
    id: context
    attributes:
      label: Captures d’écran ou informations complémentaires
      description: Logs, taille du document, bibliothèque locale ou iCloud Drive, etc.
